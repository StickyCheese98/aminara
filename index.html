var TX={
  en:{eye:"Private preview",h:"This preview is locked.",p:"Enter the password to open it.",label:"Password",btn:"Open",busy:"Opening",err:"That password is not right.",chk:"Checking this browser",ok:"Encrypted preview \u00b7 ready",bad:"This browser cannot open the preview. Try a current version of Chrome, Safari, Edge or Firefox."},

function b2u(b){var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++){u[i]=s.charCodeAt(i);}return u;}
function u2b(u){var s="";for(var i=0;i<u.length;i++){s+=String.fromCharCode(u[i]);}return btoa(s);}
function dec(raw,iv,data){
  return crypto.subtle.importKey("raw",raw,{name:"AES-GCM"},false,["decrypt"]).then(function(k){
    return crypto.subtle.decrypt({name:"AES-GCM",iv:iv},k,data);
  }).then(function(buf){return new TextDecoder().decode(buf);});
}
function derive(pw){
  return crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]).then(function(k){
    return crypto.subtle.deriveBits({name:"PBKDF2",salt:b2u(CFG.salt),iterations:CFG.iter,hash:"SHA-256"},k,256);
  }).then(function(bits){return new Uint8Array(bits);});
}
/* Puts the unlocked page into the document, top-level node by node, in order. Scripts are
   created fresh so they run, and an external script is waited for before the next node. */
function fresh(old){var s=document.createElement("script");for(var i=0;i<old.attributes.length;i++){s.setAttribute(old.attributes[i].name,old.attributes[i].value);}s.text=old.textContent;return s;}
function inject(html,parent){
  var tpl=document.createElement("template");tpl.innerHTML=html;
  var nodes=Array.prototype.slice.call(tpl.content.childNodes),p=Promise.resolve();
  nodes.forEach(function(n){p=p.then(function(){
    if(n.nodeType===1&&n.tagName==="SCRIPT"){
      return new Promise(function(done){
        var s=fresh(n);
        if(s.src){s.onload=s.onerror=function(){done();};parent.appendChild(s);}
        else{parent.appendChild(s);done();}
      });
    }
    parent.appendChild(n);
  });});
  return p;
}
function setStat(cls,text){stat.className="g-stat"+(cls?" "+cls:"");stat.querySelector("span").textContent=text;}
function selfTest(){
  if(!(window.crypto&&crypto.subtle&&window.TextDecoder&&window.TextEncoder)){return Promise.reject(new Error("nocrypto"));}
  var box=document.createElement("div");box.hidden=true;document.body.appendChild(box);
  return dec(b2u(CFG.tkey),b2u(CFG.tiv),b2u(CFG.tdata)).then(function(html){return inject(html,box);}).then(function(){
    var ok=window.__gateProbe===1&&!!document.getElementById("gateProbe");
    if(box.parentNode){box.parentNode.removeChild(box);}
    try{delete window.__gateProbe;}catch(e){window.__gateProbe=undefined;}
    if(!ok){throw new Error("probe");}
  });
}
function openPage(raw,remember){
  return dec(raw,b2u(CFG.iv),b2u(CFG.data)).then(function(html){
    if(remember){try{sessionStorage.setItem(SS,u2b(raw));}catch(e){}}
    var css=document.getElementById("gate-css");
    if(gate.parentNode){gate.parentNode.removeChild(gate);}
    if(css&&css.parentNode){css.parentNode.removeChild(css);}
    root.classList.remove("gate-on");
    return inject(html,document.body);
  });
}
var ready=false;
form.addEventListener("submit",function(e){
  e.preventDefault();
  if(!ready||btn.disabled){return;}
  msg.textContent="";btn.disabled=true;btn.textContent=T.busy;
  derive(inp.value).then(function(raw){return openPage(raw,true);}).catch(function(){
    btn.disabled=false;btn.textContent=T.btn;msg.textContent=T.err;
    try{inp.focus();inp.select();}catch(e2){}
  });
});
selfTest().then(function(){
  ready=true;setStat("ok",T.ok);
  if(saved){
    return openPage(b2u(saved),false).catch(function(){
      try{sessionStorage.removeItem(SS);}catch(e){}
      gate.hidden=false;
    });
  }
  if(window.matchMedia&&window.matchMedia("(pointer:fine)").matches){try{inp.focus();}catch(e){}}
}).catch(function(){
  gate.hidden=false;btn.disabled=true;setStat("bad",T.bad);
});
